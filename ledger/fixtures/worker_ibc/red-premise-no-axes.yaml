# that ran — but states no axis coordinates: it never says whether the ground
# it puts the walk on is determined, certifiable, or monotone. The core's
# ClaimHasAxes deliberately does NOT refuse this (an extracted claim may
# arrive unassessed and the query reports it); the obligation is the IBC
# author's alone, so it lives here -> PremiseHasAxes. Single-violation by
# construction: the coordinate-conditioned predicates (CertifiabilityFibered,
# NonMonotoneNamesCure) are vacuous where axes are absent, so nothing earlier
# in the fold can claim this failure.
