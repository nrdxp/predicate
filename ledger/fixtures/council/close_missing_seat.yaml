# A decisions ledger (no `seats`) -> DecisionLedger path.
decisions:
  - id: M1
    type: close
    proposer: { kind: agent, name: architect }
    at: "df35300"
    assent: [architect, maintainer, human]
    verdict: "closed short a judge"
    grounding:
      claim: "head ratified and two judging seats concurred, but the auditor never assented"
