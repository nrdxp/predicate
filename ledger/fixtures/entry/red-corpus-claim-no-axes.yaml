# Corpus red: ClaimHasAxes on the live path. A claim carrying no axis
# coordinates records no classification, so its cure is not derivable and the
# `unpaid_cures.unassessed` view is the only thing that can report it — a view,
# not a refusal. The contract is what makes the omission an error rather than a
# statistic. The violation sits SECOND by design.
entries:
  - id: e-clean
    statement: "A well-formed proved claim standing beside the violation."
    assertion: claim
    backing: corroborated
    signer:
      kind: agent
      name: architect-seat
    check:
      command: "bash ledger/gate/test_entry.sh"
      ran: true
      at: "deadbeef01"
    axes:
      determined: true
      certifiable: true
      monotone: true
  - id: e-claim-noaxes
    statement: "A claim carrying no axis coordinates."
    assertion: claim
    backing: corroborated
    signer:
      kind: agent
      name: architect-seat
    check:
      command: "true"
      ran: true
      at: "deadbeef05"
