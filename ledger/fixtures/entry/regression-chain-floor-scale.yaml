# Performance regression guard for chain_floor (entries_query.ncl).
#
# GENERATED, not hand-authored — 45 independent derivation chains of depth
# 20 (900 entries total), matching the LIVE corpus's own measured shape
# (many bounded chains, not one) rather than a pathological single mega-
# chain. This is deliberately close to the size and depth that first broke
# the corpus in production: the pre-fix chain_floor implementation re-scanned
# every entry on every propagation round (`step` folded over the WHOLE
# corpus every round instead of converging), so cost grew with rounds x
# entries; at this scale that OOM-killed the process. Reproduced here:
# `git stash && nickel export <this file> --apply-contract entries_query.ncl`
# at the pre-fix revision dies the same way. See ledger/gate/test_entries_extract.sh
# for the guard that runs this under a hard memory cap and a wall-clock bound.
#
# Regenerate with (not run automatically — the checked-in file IS the fixture):
#   python3 - <<'EOF'
#   import json
#   n_chains, depth = 45, 20
#   entries = []
#   for c in range(1, n_chains + 1):
#       for i in range(1, depth + 1):
#           eid = f"chain{c}:C{i}"
#           if i == 1:
#               entries.append({"id": eid, "statement": f"Chain {c} floor entry {i}, corroborated leaf.",
#                   "assertion": "claim", "backing": "corroborated",
#                   "signer": {"kind": "agent", "name": "worker"},
#                   "check": {"command": "true", "ran": True, "at": "deadbeef01"}})
#           else:
#               entries.append({"id": eid, "statement": f"Chain {c} entry {i}, derives from C{i-1}.",
#                   "assertion": "claim", "backing": "unclosed",
#                   "signer": {"kind": "agent", "name": "worker"},
#                   "because": [{"kind": "corpus", "name": f"chain{c}:C{i-1}"}]})
#   json.dump({"entries": entries}, open("regression-chain-floor-scale.yaml", "w"), indent=2)
#   EOF
