# Lone-entry green: an unclosed CLAIM whose sole provenance is the new
# entry-level `external_refs` field the extractor mirrors from its own share
# of the `external_refs` sidecar — no depends, no because, no supersedes. This
# is the majority shape among the 22 (20 of them): a synthesis honestly citing
# an antecedent that structurally cannot be a corpus entry (a repository
# document, a doctrine, a pre-standard deposit, ...). TODAY this fails at
# SHAPE — `external_refs` is not yet a field entry.ncl's `Entry` declares, so
# the contract reports "extra field `external_refs`" before ProvenanceGate
# ever runs. The fix both declares the field and widens ProvenanceGate to
# consult it.
id: c-cited-outside-corpus
statement: "A synthesis whose named antecedent is a repository document, not a corpus entry."
assertion: claim
backing: unclosed
signer:
  kind: agent
  name: architect-seat
external_refs:
  - docs/entries.md
axes:
  determined: true
  certifiable: false
  monotone: true
