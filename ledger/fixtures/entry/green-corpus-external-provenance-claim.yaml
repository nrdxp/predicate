# CORRECTED under ruling-provenance-representation (ledger commit f257f6f) —
# see green-external-provenance-claim.yaml for the full account of what
# changed and why.
#
# Corpus green: the same external-provenance-only shape, at the corpus
# granularity — a predicate live on one branch and dead on the other is a
# predicate that never fires (entry_apply.ncl's own doctrine), so this pins
# EntryStore's per-entry conformance fold applying the same widened
# ProvenanceGate to a tagged `because` entry. TODAY this fails at SHAPE for
# the same reason as the lone-entry case: `because` is `Array Ref`, and a
# tagged record element breaks `NonEmptyString`.
entries:
  - id: c-cited-outside-corpus
    statement: "A synthesis whose named antecedent is a repository document, not a corpus entry."
    assertion: claim
    backing: unclosed
    signer:
      kind: agent
      name: architect-seat
    because:
      - kind: external
        name: docs/entries.md
    axes:
      determined: true
      certifiable: false
      monotone: true
