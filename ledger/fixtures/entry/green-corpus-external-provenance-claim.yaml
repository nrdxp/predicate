# Corpus green: the same external-provenance-only shape as
# green-external-provenance-claim.yaml, at the corpus granularity — a
# predicate live on one branch and dead on the other is a predicate that
# never fires (entry_apply.ncl's own doctrine), so this pins EntryStore's
# per-entry conformance fold applying the same widened ProvenanceGate. TODAY
# this fails at SHAPE for the same reason as the lone-entry case: `external_refs`
# is an undeclared field on Entry.
entries:
  - id: c-cited-outside-corpus
    statement: "A synthesis whose named antecedent is a repository document, not a corpus entry."
    assertion: claim
    backing: unclosed
    signer:
      kind: agent
      name: architect-seat
    external_refs:
      - docs/entries.md
    axes:
      determined: true
      certifiable: false
      monotone: true
