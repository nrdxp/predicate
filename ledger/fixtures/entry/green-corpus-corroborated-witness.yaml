# Corpus pairing for the must-not-regress pin (node/backing-converse): a
# corroborated claim naming a witness stays green inside an aggregate too,
# not only in isolation.
entries:
  - id: e-corroborated-and-witnessed
    statement: "The draft contract typechecks clean, and the head reviewed it too."
    assertion: claim
    backing: corroborated
    signer:
      kind: agent
      name: architect-seat
    check:
      command: "nickel typecheck ledger/contracts/entry.ncl"
      ran: true
      at: "deadbeef01"
    witness:
      name: nrd
      at: "deadbeef01"
    axes:
      determined: true
      certifiable: true
      monotone: true
  - id: e-derived
    statement: "The typecheck result carries into the corpus aggregate."
    assertion: claim
    backing: unclosed
    signer:
      kind: derived
    depends:
      - e-corroborated-and-witnessed
    axes:
      determined: true
      certifiable: false
      monotone: true
