name: CI

# Run the gate test-system on every push and pull request, so a regression in
# any enforcement gate fails CI — the machine check that the tests actually run.
on:
  push:
  pull_request:

jobs:
  gates:
    name: gate suites + doc audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `nickel` is the only non-standard dependency. It is installed onto PATH
      # via Nix; the gate machinery calls `nickel` directly (no nix-run fallback
      # — shell.nix provides nickel 1.14.0 for local dev; CI installs it via nix
      # profile). python3, bash, and git are preinstalled on ubuntu-latest.
      - uses: DeterminateSystems/nix-installer-action@main
      - name: install nickel
        run: nix profile install nixpkgs#nickel

      - name: gate test suites
        run: |
          set -euo pipefail
          bash ledger/gate/test_reconcile.sh
          bash ledger/gate/test_surface_protocol.sh
          bash ledger/gate/test_gates.sh
          bash ledger/gate/test_adherence.sh
          bash ledger/gate/test_project_gates.sh
          bash ledger/gate/test_colocation_gate.sh
          bash ledger/gate/test_recorder_hook.sh

      - name: contract typecheck (all ledger/contracts/*.ncl)
        run: bash ledger/gate/test_contract_typecheck.sh

      - name: fixture polarity sweep (all ledger/fixtures/*.ncl + *.yaml)
        run: bash ledger/gate/test_fixture_sweep.sh

      # The polarity sweep checks the sources export as declared; the other
      # five suites check the MATERIALIZED install — each runs
      # conditioning/install.sh into a throwaway HOME (PREDICATE_CLAUDE_DIR/
      # PREDICATE_GEMINI_DIR), so they are CI-safe for the same reason
      # test_conditioning.sh below is. The materialized suites stay separate
      # because they answer separate questions: the discipline suite holds the
      # typed-claim grammar at its ruled rung, the report-fraction suite holds
      # the always-on law to the third reporting obligation, the
      # scrutiny-allocation suite holds it to allocating attention by stakes
      # and uncloseability rather than spreading it flat, and the open-surface
      # suite holds it to working the record's unbacked claims and unanswered
      # questions as debt and as resource at once. The record-first suite is
      # the odd one: it measures a PERSONA rung rather than core, because its
      # rule binds the conductor alone — so its reach case is the inverse,
      # present in the composer surface and absent from core and from every
      # dispatched-role delta.
      - name: conditioning sweep (compose.ncl, core.ncl, probe_no_core.ncl)
        run: |
          set -euo pipefail
          bash ledger/gate/test_conditioning_sweep.sh
          bash ledger/gate/test_conditioning_discipline.sh
          bash ledger/gate/test_report_fraction.sh
          bash ledger/gate/test_scrutiny_allocation.sh
          bash ledger/gate/test_open_surface.sh
          bash ledger/gate/test_record_first.sh

      # The prose grammar's vocabulary lives in docs/entries.md and is READ by
      # ledger/derive/extract_entries.py. Nothing but this step holds the two
      # together, so it runs the binding check and the mutation suite that
      # proves the check discriminates.
      - name: grammar home ↔ extractor vocabulary
        run: |
          set -euo pipefail
          python3 ledger/gate/check_grammar_home.py
          bash ledger/gate/test_grammar_home.sh

      # Reference resolution across documents. The suite above binds the
      # grammar's vocabulary to the extractor; this one binds the extractor's
      # reference resolution to the corpus, which is a property no single-file
      # fixture can state: its fixtures are multi-document corpora extracted a
      # directory at a time.
      - name: corpus-wide reference ids
        run: bash ledger/gate/test_corpus_ids.sh

      - name: gate-scope completeness (fails on undeclared gate)
        run: bash ledger/gate/check_scopes.sh

      - name: gate demonstrations (smoke)
        run: |
          set -euo pipefail
          bash ledger/gate/demo_scale_invariant.sh
          bash ledger/gate/demo_unauthorized.sh

      - name: orchestration demo typecheck (skills/orchestration/demo/*.ncl)
        run: |
          set -euo pipefail
          for f in skills/orchestration/demo/*.ncl; do
            [ -f "$f" ] || continue
            echo "checking $f"
            nickel export -I ledger/contracts "$f" >/dev/null
          done

      - name: doc audit (links + anchors)
        run: python3 skills/doc-audit/scripts/check_docs.py .

      - name: conditioning delivery e2e + bootstrap uninstall (hermetic)
        run: |
          set -euo pipefail
          bash conditioning/test_conditioning.sh
          bash bootstrap/test_uninstall.sh

      # NOTE: bootstrap/test_bootstrap.sh is intentionally NOT run here. It
      # performs a real `claude plugin install` (Claude CLI + network + auth),
      # which is not CI-appropriate; run it manually when changing bootstrap.
      # The two tests above ARE CI-safe: test_conditioning.sh installs into a
      # throwaway HOME (PREDICATE_CLAUDE_DIR/PREDICATE_GEMINI_DIR), and
      # test_uninstall.sh seeds surfaces directly and uses a mock `claude` — no
      # network, no auth, no real ~ touched.
